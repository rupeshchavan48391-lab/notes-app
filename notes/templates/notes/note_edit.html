{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Note - Notes App</title>

    <link rel="stylesheet" href="{% static 'notes/css/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            📝 Notes App
        </div>
    </nav>


    <main class="form-container">

        <h1>Edit Note</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ note.title }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="content">
                    Content
                </label>

                <textarea
                    id="content"
                    name="content"
                    required
                >{{ note.content }}</textarea>

            </div>


            <button
                type="submit"
                class="btn btn-primary">
                Update Note
            </button>

        </form>


        <a
            href="{% url 'note_list' %}"
            class="back-link">
            ← Back to Notes
        </a>

    </main>

</body>

</html>
