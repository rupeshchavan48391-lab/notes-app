{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Note - Notes App</title>

    <link rel="stylesheet" href="{% static 'notes/css/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            📝 Notes App
        </div>
    </nav>


    <main class="form-container">

        <h1>Delete Note</h1>

        <p class="note-content">
            Are you sure you want to delete this note?
        </p>

        <h2>
            {{ note.title }}
        </h2>

        <br>


        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-delete">
                Yes, Delete
            </button>

            <a
                href="{% url 'note_list' %}"
                class="btn">
                Cancel
            </a>

        </form>

    </main>

</body>

</html>
